# ==========================================
# Database Configuration
# ==========================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:doc_rag}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  # ==========================================
  # JPA / Hibernate Configuration
  # ==========================================

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  # ==========================================
  # Spring AI - OpenRouter Configuration
  # ==========================================

  ai:
    openai:
      # OpenRouter is OpenAI-compatible
      base-url: https://openrouter.ai/api

      # OpenRouter API Key
      api-key: ${OPENROUTER_API_KEY}

      # ----------------------------------------
      # Chat Model
      # ----------------------------------------

      chat:
        model: ${OPENROUTER_CHAT_MODEL:liquid/lfm-2.5-2.6b:free}
        temperature: 0.2

      # ----------------------------------------
      # Embedding Model
      # ----------------------------------------

      embedding:
        model: ${OPENROUTER_EMBEDDING_MODEL:liquid/lfm-2.5-embedding-350m:free}

    # ==========================================
    # PGVector Configuration
    # ==========================================

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        table-name: vector_store
        schema-name: public

  # ==========================================
  # File Upload Configuration
  # ==========================================

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB


# ==========================================
# Application Configuration
# ==========================================

app:
  rag:

    # Number of characters/tokens used for
    # splitting documents depends on your
    # chunking implementation.
    chunk-size: 600

    # Overlap between chunks
    chunk-overlap: 100

    # Number of similar documents to retrieve
    top-k: 5

    # Minimum similarity score
    similarity-threshold: 0.0


  # ========================================
  # CORS Configuration
  # ========================================

  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"